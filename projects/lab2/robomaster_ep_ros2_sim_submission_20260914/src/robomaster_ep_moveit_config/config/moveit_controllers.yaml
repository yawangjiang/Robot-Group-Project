moveit_simple_controller_manager:
  controller_names: [arm_controller, gripper_controller]
  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [shoulder_joint, elbow_joint]
  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [left_finger_joint, right_finger_joint]
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
trajectory_execution:
  # The folded pickup approach needs additional settling time on the Jetson's
  # simulated position interface.  Keep endpoint tolerances strict and make
  # MoveIt's watchdog longer than the controller's 3 s goal-time allowance.
  allowed_execution_duration_scaling: 2.0
  allowed_goal_duration_margin: 4.0
  allowed_start_tolerance: 0.02
